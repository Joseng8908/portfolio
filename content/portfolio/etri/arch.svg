<svg width="720" height="560" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="'NanumGothic', 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8A8F98"/>
    </marker>
    <marker id="arrowKV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3B6FB0"/>
    </marker>
  </defs>

  <!-- ============ Client ============ -->
  <rect x="285" y="24" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1.4"/>
  <text x="360" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1D21">Client</text>

  <!-- Client -> Proxy -->
  <line x1="360" y1="70" x2="360" y2="110" stroke="#8A8F98" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ Proxy ============ -->
  <rect x="255" y="112" width="210" height="52" rx="8" fill="#F5F7FA" stroke="#C9CDD4" stroke-width="1.4"/>
  <text x="360" y="135" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1D21">Proxy</text>
  <text x="360" y="153" text-anchor="middle" font-size="11.5" fill="#6B7079">AppProxy · prefill/decode 중계</text>

  <!-- Proxy -> Prefill (request) -->
  <path d="M300,164 L200,200" stroke="#8A8F98" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <!-- Proxy -> Decode (request) -->
  <path d="M420,164 L520,200" stroke="#8A8F98" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ Prefill node ============ -->
  <rect x="60" y="204" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1.4"/>
  <rect x="60" y="204" width="240" height="34" rx="10" fill="#EAF1F9"/>
  <rect x="60" y="224" width="240" height="14" fill="#EAF1F9"/>
  <text x="180" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#2B5486">PREFILL</text>
  <!-- GPU chip -->
  <rect x="88" y="256" width="184" height="42" rx="7" fill="#EAF1F9" stroke="#B9CDE3" stroke-width="1.2"/>
  <text x="180" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#2B5486">GPU · A100 80GB × 4</text>
  <text x="180" y="290" text-anchor="middle" font-size="11" fill="#5E7690">Tensor Parallelism 4</text>
  <text x="180" y="320" text-anchor="middle" font-size="11.5" fill="#6B7079">vLLM · KV producer</text>
  <text x="180" y="338" text-anchor="middle" font-size="11.5" fill="#6B7079">HAPIS runtime</text>

  <!-- ============ Decode node ============ -->
  <rect x="420" y="204" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1.4"/>
  <rect x="420" y="204" width="240" height="34" rx="10" fill="#FBF0E6"/>
  <rect x="420" y="224" width="240" height="14" fill="#FBF0E6"/>
  <text x="540" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#9A6321">DECODE</text>
  <!-- NPU chip -->
  <rect x="448" y="256" width="184" height="42" rx="7" fill="#FBF0E6" stroke="#E3C9A8" stroke-width="1.2"/>
  <text x="540" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#9A6321">NPU · Blackhole × 4</text>
  <text x="540" y="290" text-anchor="middle" font-size="11" fill="#946E3E">Tenstorrent</text>
  <text x="540" y="320" text-anchor="middle" font-size="11.5" fill="#6B7079">vLLM · KV consumer</text>
  <text x="540" y="338" text-anchor="middle" font-size="11.5" fill="#6B7079">tt-metal · HAPIS</text>

  <!-- ============ KV transfer (prefill -> decode) ============ -->
  <line x1="300" y1="279" x2="420" y2="279" stroke="#3B6FB0" stroke-width="2" marker-end="url(#arrowKV)"/>
  <rect x="312" y="248" width="96" height="24" rx="12" fill="#3B6FB0"/>
  <text x="360" y="264" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">KV Cache</text>
  <text x="360" y="298" text-anchor="middle" font-size="10.5" fill="#3B6FB0" font-weight="600">Mooncake RDMA · InfiniBand</text>

  <!-- ============ Platform band ============ -->
  <rect x="60" y="392" width="600" height="60" rx="10" fill="#F5F7FA" stroke="#C9CDD4" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="360" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#42474F">Backend.AI</text>
  <text x="360" y="436" text-anchor="middle" font-size="11" fill="#6B7079">컨테이너 배포 · 헬스체크 자동복구 · 서비스 디스커버리 · host networking</text>

  <!-- dashed connectors platform to nodes -->
  <line x1="180" y1="354" x2="180" y2="392" stroke="#C9CDD4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="540" y1="354" x2="540" y2="392" stroke="#C9CDD4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="360" y1="164" x2="360" y2="164" stroke="#C9CDD4" stroke-width="1.2"/>

  <!-- legend -->
  <text x="360" y="492" text-anchor="middle" font-size="10.5" fill="#9AA0A8">회색 화살표 = 요청 경로   ·   파란 화살표 = KV Cache RDMA 전송</text>
</svg>
