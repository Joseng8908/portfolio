name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allows manual runs from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel an in-flight deploy — let it finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
      HUGO_ENVIRONMENT: production
      TZ: Asia/Seoul
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls themes/PaperMod
          fetch-depth: 0          # full history, so .GitInfo / lastmod work

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources
            /tmp/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('**/*.md', 'hugo.toml', 'assets/**') }}
          restore-keys: hugo-${{ runner.os }}-

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --cacheDir /tmp/hugo_cache \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
